name: ci

on:
  pull_request:
    branches:
      - main

jobs:
  version-bump:
    name: plugin-version-bumped
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: fail if skills/hooks/module changed without a plugin.json version bump
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD -- 'skills/**' 'hooks/**' '**/*.psm1' '**/*.ps1')
          if [ -z "$CHANGED" ]; then
            echo "No skill/hook/module files changed; nothing to check."
            exit 0
          fi
          BASE_VERSION=$(git show "$BASE_SHA:.claude-plugin/plugin.json" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')
          HEAD_VERSION=$(node -pe 'JSON.parse(require("fs").readFileSync(".claude-plugin/plugin.json","utf8")).version')
          echo "Changed files:"
          echo "$CHANGED"
          echo "Base version: $BASE_VERSION, head version: $HEAD_VERSION"
          if [ "$BASE_VERSION" = "$HEAD_VERSION" ]; then
            echo "::error::skills/, hooks/, or a PowerShell module changed but .claude-plugin/plugin.json's version was not bumped. Claude Code's marketplace update decides whether an install is stale by comparing this exact string, not the git SHA (see the 2026-07-28 incident in the plugin's wiki project note) — an unbumped version means installed copies silently never learn this change exists."
            exit 1
          fi

  evals:
    name: skill-trigger-evals
    runs-on: ubuntu-latest
    # claude plugin eval is early access, gated per organization, and needs a
    # real model credential to actually run a prompt against each skill's
    # description. Forks and PRs from outside collaborators never have that
    # secret, so the job is skipped rather than failing them - see evals/README.md.
    # A job-level `if` cannot read the secrets context (GitHub rejects the whole
    # workflow file), so the gate lives on each step via the job's env instead.
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: skip when no model credential is available
        if: ${{ env.ANTHROPIC_API_KEY == '' }}
        run: echo "::notice::ANTHROPIC_API_KEY is not set for this run (fork or outside PR); skipping the evals job - see evals/README.md."

      - name: checkout
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        uses: actions/checkout@v4

      - name: setup node
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: install claude code cli
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: npm install -g @anthropic-ai/claude-code@latest

      - name: run skill-trigger evals
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: |
          set -uo pipefail
          output=$(claude plugin eval . --json eval-results.json --no-publish --threshold 1.0 2>&1)
          status=$?
          echo "$output"

          if echo "$output" | grep -qi "early access"; then
            echo "::notice::claude plugin eval is not enabled for this organization yet (early access gate). Skipping rather than failing - see evals/README.md."
            exit 0
          fi

          if [ "$status" -ne 0 ]; then
            echo "::error::One or more eval cases scored below the 1.0 threshold - a skill description likely triggers on a prompt it shouldn't, or fails to trigger on one it should. See eval-results.json and evals/README.md."
          fi
          exit "$status"

      - name: upload eval report
        if: ${{ always() && env.ANTHROPIC_API_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            eval-results.json
            evals/results/
          if-no-files-found: ignore

# A PSScriptAnalyzer lint job was evaluated (borrowed from
# microsoft/power-platform-skills' CI, see docs/microsoft-power-platform-skills-overlap.md
# §5-6) and deliberately not added yet. Two rulesets, exact warning counts and
# locations, and what each remaining warning is: docs/psscriptanalyzer-options.md.
